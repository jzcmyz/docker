services:
  overseerr:
    image: lscr.io/linuxserver/overseerr:latest
    container_name: overseerr
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    profiles: ["media", "all"]
    networks:
      - t3_proxy
    ports:
      - "5055:5055"
    volumes:
      - ${DOCKERDIR}/appdata/overseerr:/config
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.overseerr.entrypoints=websecure-internal"
      - "traefik.http.routers.overseerr.rule=Host(`overseerr.jzcmyz.com`)"
      - "traefik.http.routers.overseerr.tls=true"
      - "traefik.http.services.overseerr.loadbalancer.server.port=5055"
      - "traefik.docker.network=t3_proxy"