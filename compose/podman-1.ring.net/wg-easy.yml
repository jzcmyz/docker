# volumes:
#   etc_wireguard:

services:
  wg-easy:
    environment:
      - WG_HOST=202.128.116.80
      - PORT=51821
    #  - HOST=0.0.0.0
      - INSECURE=true
      - DISABLE_IPV6=true

    image: ghcr.io/wg-easy/wg-easy:15 
    container_name: wg-easy
    networks:
      - t3_proxy
    security_opt:
      - no-new-privileges:true
    restart: 'unless-stopped'
    profiles: ["core", "wg-easy", "all"]

    volumes:
      - ${DOCKERDIR}/appdata/wg-easy/config:/etc/wireguard
      #- etc_wireguard:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    ports:
      - "51820:51820/udp"
      - "51821:51821/tcp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
      # - NET_RAW # ⚠️ Uncomment if using Podman
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      # - net.ipv6.conf.all.disable_ipv6=0
      # - net.ipv6.conf.all.forwarding=1
      # - net.ipv6.conf.default.forwarding=1

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wg-easy.entrypoints=websecure-internal"
      - "traefik.http.routers.wg-easy.rule=Host(`wg-easy.${DOMAINNAME_1}`)"
      - "traefik.http.routers.wg-easy.tls=true"
      #- "traefik.http.routers.wg-easy.service=wg-easy"
      - "traefik.http.services.wg-easy.loadbalancer.server.port=51821"
      - "traefik.docker.network=t3_proxy"


